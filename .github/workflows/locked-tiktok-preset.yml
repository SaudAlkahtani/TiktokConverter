name: Locked TikTok preset

on:
  push:
    branches:
      - release/editor-studio
      - release/combined-converter
      - release/telegram-publisher
      - release/local-uploader
  pull_request:
    branches:
      - release/editor-studio
      - release/combined-converter
      - release/telegram-publisher
      - release/local-uploader

jobs:
  check-preset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test test/tiktok-preset.test.js
