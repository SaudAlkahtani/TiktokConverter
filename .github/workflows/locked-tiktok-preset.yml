name: Converter profile checks

on:
  push:
    branches:
      - release/editor-studio
      - release/combined-converter
      - release/telegram-publisher
      - release/local-uploader
      - codex/vertical-1080p-fps-bitrate-test
  pull_request:
    branches:
      - release/editor-studio
      - release/combined-converter
      - release/telegram-publisher
      - release/local-uploader
      - codex/vertical-1080p-fps-bitrate-test

jobs:
  check-preset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test test/tiktok-preset.test.js
        if: ${{ hashFiles('test/tiktok-preset.test.js') != '' }}
      - run: node --test test/vertical-test.test.js test/both.test.js test/audio-tabs.test.js
        if: ${{ hashFiles('test/vertical-test.test.js') != '' }}
